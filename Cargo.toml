[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/benwbooth/screentime"

[workspace.dependencies]
screentime-common = { path = "crates/common" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Size-optimized build for the WebAssembly UI only. The native binaries keep the default release
# profile, and the PAM module needs unwinding so a panic can't take down the login process.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# One build for everything: devloop (the deployed server), cargo run, cargo test
# and the editor all use this profile, so they share target/debug. It's
# release-grade (optimized, no debug info) and stays incremental, so a small
# change rebuilds in seconds. `nix build` (release) is only for packaging.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true
