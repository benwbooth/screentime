# Builds everything on a version tag (v1.2.3) and publishes a GitHub release with:
#   screentime-linux-<arch>.tar.gz   server, Linux client, PAM module, greeter, web UI
#   screentime-windows.zip           Windows service, tray app, sign-in tile, install.ps1
#   screentime-macos.zip             Mac agent + menu-bar app (universal), install.sh
# and pushes the server image to ghcr.io/<owner>/screentime:<version> and :latest.
# Pull requests that touch the build run the same jobs without publishing anything.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "crates/macos/build.sh"
      - "crates/windows/build-windows.sh"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: wasm-bindgen-cli matching Cargo.lock
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install --locked wasm-bindgen-cli --version "$v"
      - name: Build
        run: |
          cargo build --release --locked -p screentime-server -p screentime-client -p pam_screentime -p screentime-greeter
          crates/web/build.sh target/web
      - name: Package
        run: |
          d=dist/screentime-linux-${{ matrix.arch }}
          mkdir -p $d/bin $d/lib/security $d/share/screentime
          for b in screentime screentime-client screentime-greeter screentime-server; do
            install -m755 target/release/$b $d/bin/
          done
          install -m755 target/release/libpam_screentime.so $d/lib/security/pam_screentime.so
          cp -r target/web $d/share/screentime/web
          cp README.md $d/
          tar -C dist -czf dist/screentime-linux-${{ matrix.arch }}.tar.gz screentime-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: crates/windows/build-windows.sh --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/windows-dist/screentime-windows.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: OUT=dist/screentime-macos crates/macos/build.sh --universal
      - name: Package
        run: |
          cp crates/macos/install.sh crates/macos/uninstall.sh dist/screentime-macos/
          cd dist && ditto -c -k --keepParent screentime-macos screentime-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/screentime-macos.zip

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#docker && docker load < result
      - name: Push to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/screentime
          version=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag screentime:latest $image:$version
          docker tag screentime:latest $image:latest
          docker push $image:$version
          docker push $image:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts && sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --notes "Server image: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/screentime:${GITHUB_REF_NAME#v}\`" *
