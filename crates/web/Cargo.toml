[package]
name = "screentime-web"
description = "Leptos admin UI (desktop and mobile layouts), built to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
screentime-common.workspace = true
chrono = { workspace = true }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
# Must match the wasm-bindgen CLI in nixpkgs.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "HtmlInputElement", "Location"] }
