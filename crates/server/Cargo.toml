[package]
name = "screentime-server"
description = "Policy server: SQLite store, HTTPS API, Leptos UI host, ntfy notifications"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
screentime-common.workspace = true
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
chrono.workspace = true
http = "1"
hex = "0.4"
rand = "0.9"
rpassword = "7"
web-push-native = "0.5"
base64ct = { version = "1", features = ["alloc"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
time = "0.3"
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
serde_urlencoded = "0.7"
